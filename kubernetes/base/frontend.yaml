
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pulsetask-frontend
  namespace: pulsetask
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pulsetask-frontend
  template:
    metadata:
      labels:
        app: pulsetask-frontend
    spec:
      containers:
        - name: frontend
          image: devaraj74/pulsetask-frontend:0ee5661
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pulsetask-frontend
  namespace: pulsetask
spec:
  type: NodePort
  selector:
    app: pulsetask-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080

